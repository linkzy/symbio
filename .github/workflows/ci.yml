name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows is the tested platform, and the vault tests need an OS credential store.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          npm test
      # The runtimes' APIs as Symbio uses them: the pinned OpenCode (dev dependency) (no model or sign-in needed), and
      # GitHub Copilot CLI when the COPILOT_GITHUB_TOKEN secret is set (skipped otherwise; nothing is billed).
      - run: npm run test:contract
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      - run: npm run build
      # The whole app in a real browser (Edge), once per runtime: against a stand-in OpenCode and a
      # stand-in Copilot SDK, both with the same scripted model.
      - run: npm run test:e2e
