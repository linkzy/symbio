# The one-line installers (scripts/install/) on clean runners, through the platform smoke tests
# (scripts/platform/smoke.*; docs/platform-testing.md): install the published Symbio with a private
# Node.js, start it, save a secret, install the runtimes, start it again, update in place, uninstall.
name: Installers

on:
  push:
    paths: ["scripts/install/**", "scripts/platform/smoke.*", ".github/workflows/install.yml"]
  pull_request:
    paths: ["scripts/install/**", "scripts/platform/smoke.*", ".github/workflows/install.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh] # Windows PowerShell 5.1 (a new Windows) and PowerShell 7
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      SMOKE_DIR: ${{ github.workspace }}\smoke # (the runner context isn't available here)
      SMOKE_INSTALLER: ${{ github.workspace }}\scripts\install\install.ps1
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test (as `irm … | iex` runs the installer)
        run: |
          New-Item -ItemType Directory $env:SMOKE_DIR | Out-Null
          Get-Content -Raw scripts/platform/smoke.ps1 | iex
          Get-Content "$env:SMOKE_DIR\installer.log"
          if ((Get-Content "$env:SMOKE_DIR\done") -ne "0") { throw "the smoke test failed" }

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test (as `curl … | sh` runs the installer)
        run: SMOKE_KEEP=1 sh scripts/platform/smoke.sh
      - name: Started again, in a new shell
        # Linux keeps the vault key only for the login session when there's no Secret Service (#9).
        continue-on-error: ${{ runner.os == 'Linux' }}
        run: sh scripts/platform/smoke.sh again
      - name: Uninstall (if the step above stopped first)
        if: always()
        run: |
          [ -e ~/.symbio/app ] && SYMBIO_UNINSTALL=1 sh < scripts/install/install.sh || true
          test ! -e ~/.symbio/app
